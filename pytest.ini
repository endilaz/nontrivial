[pytest]
# Milestone A1: the default suite is OFFLINE and must never hit the network or
# require API keys. Live-API checks (capability probes, real provider calls) are
# marked `live_api` and EXCLUDED by default via addopts below.
#
# Run the default offline suite:      pytest -q
# Run ONLY live-API tests (opt-in):   pytest -m live_api      (the CLI -m overrides
#                                      the addopts -m, since the last -m wins)
addopts = -m "not live_api" --strict-markers

# --strict-markers turns an unregistered marker into an error, so a typo like
# @pytest.mark.live-api can never silently run in the default suite.
markers =
    live_api: test performs real network calls to a paid/live provider API. Requires keys in .env; excluded from the default offline suite. Never add these to the default run.

testpaths = tests
