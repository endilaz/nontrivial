# Phase 3 baseline generation config for GLM-5.2 through OpenRouter.
#
# Route pinned to DeepInfra (researcher decision 2026-07-22, cheapest verified
# route $0.93/$2.94); the generation client fails closed without a pinned
# `provider_route` and disables provider fallback for reproducibility. Pricing
# for this exact route is verified in `src/costs.py` (last_verified 2026-07-21).
# Capability probe `glm_5_2_reasoning_field` PASSED on this route (raw
# `reasoning_content` returned; receipt hashed, expires 2026-08-20).
#
# Remaining manual review before a paid run:
# - `max_tokens` is copied from the committed smoke test because the repo does
#   not yet have an approved full-baseline output budget. Raise it manually if
#   you see truncation on real tasks.

run_id: baseline_glm_5_2_openrouter_v1
provider: openrouter
model: z-ai/glm-5.2
provider_route: DeepInfra
temperature: 0.0
max_tokens: 10240
thinking_setting:
  thinking:
    type: disabled
seed: 0
prompt_template: |
  Solve the following problem. If the answer is a person, answer with their full legal name. 
  Think step by step, then end your response with a
  single line of exactly the form `Final answer: X`.

  {problem}
prefill_mechanism: null
date: "2026-07-21"
notes: >
  Phase 3 baseline generation config for GLM-5.2 via OpenRouter on the pinned
  DeepInfra route (route approved 2026-07-22, probe-verified, price verified).
  Records the intended disabled-thinking condition.